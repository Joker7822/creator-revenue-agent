apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-revenue-agent
  labels:
    app.kubernetes.io/name: creator-revenue-agent
    app.kubernetes.io/component: api
spec:
  replicas: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: creator-revenue-agent
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: creator-revenue-agent
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: creator-revenue-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: creator-revenue-agent
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: creator-revenue-agent
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/replace-me/creator-revenue-agent:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: creator-revenue-agent-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            - name: application-secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: application-secrets
          projected:
            defaultMode: 288
            sources:
              - secret:
                  name: creator-revenue-agent-secrets
                  items:
                    - key: database_url
                      path: database_url
                    - key: service_jwt_keys_json
                      path: service_jwt_keys_json
                    - key: verification_webhook_keys_json
                      path: verification_webhook_keys_json
                    - key: audit_hash_keys_json
                      path: audit_hash_keys_json
                    - key: audit_anchor_token
                      path: audit_anchor_token
                    - key: audit_anchor_receipt_keys_json
                      path: audit_anchor_receipt_keys_json
