apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-production-deployer
  namespace: creator-revenue-agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-production-deployer
  namespace: creator-revenue-agent
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - configmaps
      - services
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - creator-revenue-agent-secrets
      - ghcr-pull
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - create
      - patch
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - create
      - delete
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-production-deployer
  namespace: creator-revenue-agent
subjects:
  - kind: ServiceAccount
    name: github-production-deployer
    namespace: creator-revenue-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-production-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: creator-revenue-agent-production-namespace-reader
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - creator-revenue-agent
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: creator-revenue-agent-production-namespace-reader
subjects:
  - kind: ServiceAccount
    name: github-production-deployer
    namespace: creator-revenue-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: creator-revenue-agent-production-namespace-reader
