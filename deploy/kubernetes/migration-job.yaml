apiVersion: batch/v1
kind: Job
metadata:
  name: creator-revenue-agent-migrate
  labels:
    app.kubernetes.io/name: creator-revenue-agent
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: creator-revenue-agent
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: creator-revenue-agent
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/replace-me/creator-revenue-agent:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/database_url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            - name: database-secret
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: database-secret
          projected:
            defaultMode: 288
            sources:
              - secret:
                  name: creator-revenue-agent-secrets
                  items:
                    - key: database_url
                      path: database_url
