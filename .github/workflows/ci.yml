name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Migrate database
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci-agent.db
        run: |
          rm -f ci-agent.db
          alembic upgrade head
          alembic current

      - name: Test
        env:
          PYTHONPATH: .
          CUSTOM_API_BASE_URL: http://127.0.0.1:8000
          CUSTOM_API_TOKEN: test-token
          INTERNAL_API_TOKEN: test-token
          DATABASE_URL: sqlite:///./ci-agent.db
        run: pytest -q


  postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creator_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creator_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Migrate PostgreSQL database
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/creator_agent
        run: |
          alembic upgrade head
          alembic current

      - name: PostgreSQL row-lock tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/creator_agent
          CUSTOM_API_BASE_URL: http://127.0.0.1:8000
          CUSTOM_API_TOKEN: test-token
          INTERNAL_API_TOKEN: test-token
          PRODUCTION_REQUIRE_ROW_LOCKING_DATABASE: "true"
        run: pytest -q tests/test_postgres_concurrency.py

      - name: Production release gate
        env:
          PYTHONPATH: .
          APP_ENV: production
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/creator_agent
          PRODUCTION_REQUIRE_ROW_LOCKING_DATABASE: "true"
          REQUIRE_HUMAN_REVIEW: "true"
          ALLOW_AUTO_PUBLISH: "false"
          ALLOW_LEGACY_ADMIN_TOKEN: "false"
          SERVICE_AUTH_MODE: jwt
          SERVICE_JWT_KEYS_JSON: '{"ci-current":"ci-jwt-secret-00000000000000000000000001"}'
          SERVICE_JWT_ACTIVE_KID: ci-current
          SERVICE_JWT_REQUIRE_ISSUED_RECORD: "true"
          REQUIRE_TRUSTED_VERIFICATION: "true"
          VERIFICATION_WEBHOOK_KEYS_JSON: '{"provider-a":{"ci-current":"ci-provider-secret-000000000000000000001"}}'
          VERIFICATION_WEBHOOK_REQUIRE_KEY_ID: "true"
          AUDIT_HASH_KEYS_JSON: '{"ci-audit":"ci-audit-secret-0000000000000000000000001"}'
          AUDIT_HASH_ACTIVE_KID: ci-audit
          AUDIT_ANCHOR_BASE_URL: https://audit-anchor.example.internal
          AUDIT_ANCHOR_TOKEN: ci-anchor-token
          AUDIT_ANCHOR_RECEIPT_KEYS_JSON: '{"ci-receipt":"ci-receipt-secret-00000000000000000000001"}'
          ENFORCE_AUDIT_ANCHOR_FRESHNESS_ON_ROLLOUT: "true"
          MAX_REQUEST_BODY_BYTES: "1048576"
          BILLING_RATE_LIMIT_PER_MINUTE: "120"
          CREDENTIAL_RATE_LIMIT_PER_MINUTE: "30"
          ROLLOUT_RATE_LIMIT_PER_MINUTE: "30"
          VERIFICATION_WEBHOOK_RATE_LIMIT_PER_MINUTE: "300"
          METRICS_EXPORT_MODE: prometheus
          EDGE_RATE_LIMIT_MODE: external
        run: python -m api_server.release_gate

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify PostgreSQL backup and restore
        env:
          PYTHONPATH: .
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/creator_agent"             -c "DELETE FROM audit_chain_state; INSERT INTO audit_chain_state (id,last_event_id,last_hash,hash_key_id,state_hash,updated_at) VALUES (1,NULL,repeat('3',64),'backup-marker',repeat('4',64),CURRENT_TIMESTAMP);"

          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/creator_agent"             bash scripts/postgres_backup.sh /tmp/creator-agent-ci.dump

          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres"             -c "DROP DATABASE IF EXISTS creator_agent_restore;"
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres"             -c "CREATE DATABASE creator_agent_restore;"

          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/creator_agent_restore"           RESTORE_CONFIRM=YES             bash scripts/postgres_restore.sh /tmp/creator-agent-ci.dump

          test "$(psql "postgresql://postgres:postgres@127.0.0.1:5432/creator_agent_restore" -Atc "SELECT last_hash FROM audit_chain_state WHERE id=1;")" = "$(printf '3%.0s' {1..64})"

          DATABASE_URL="postgresql+psycopg://postgres:postgres@127.0.0.1:5432/creator_agent_restore"             alembic current | grep "20261001_0008"


  container-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build -t creator-revenue-agent:ci .

      - name: Verify non-root image configuration
        run: |
          test "$(docker image inspect creator-revenue-agent:ci --format '{{.Config.User}}')" = "10001:10001"
          docker image inspect creator-revenue-agent:ci --format '{{json .Config.Healthcheck}}' | grep -q '"Test"'


  kubernetes-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: "v1.31.4"

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize deploy/kubernetes > rendered-kubernetes.yaml
          printf '\n---\n' >> rendered-kubernetes.yaml
          cat deploy/kubernetes/migration-job.yaml >> rendered-kubernetes.yaml
          printf '\n---\n' >> rendered-kubernetes.yaml
          cat deploy/kubernetes/secret.example.yaml >> rendered-kubernetes.yaml

      - name: Verify Kubernetes hardening invariants
        run: bash scripts/validate_kubernetes.sh rendered-kubernetes.yaml

      - name: Validate Kubernetes schemas
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            -kubernetes-version 1.31.0 \
            /work/rendered-kubernetes.yaml


  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate release workflow security
        run: python scripts/validate_release_workflow.py

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --strict

      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            git \
            --config=/repo/.gitleaks.toml \
            --redact \
            --no-banner \
            /repo

      - name: Build production image for security scan
        run: |
          docker build -t creator-revenue-agent:supply-chain .
          docker save creator-revenue-agent:supply-chain \
            -o /tmp/creator-revenue-agent-image.tar

      - name: Report HIGH and CRITICAL image vulnerabilities
        run: |
          docker run --rm \
            -v /tmp:/tmp \
            aquasec/trivy:0.74.0 \
            image \
            --input /tmp/creator-revenue-agent-image.tar \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Block fixable CRITICAL image vulnerabilities
        run: |
          docker run --rm \
            -v /tmp:/tmp \
            aquasec/trivy:0.74.0 \
            image \
            --input /tmp/creator-revenue-agent-image.tar \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      - name: Generate CycloneDX image SBOM
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -v /tmp:/tmp \
            aquasec/trivy:0.74.0 \
            image \
            --input /tmp/creator-revenue-agent-image.tar \
            --format cyclonedx \
            --output /work/sbom.cdx.json

          python scripts/validate_sbom.py sbom.cdx.json
          sha256sum sbom.cdx.json > sbom.cdx.json.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creator-revenue-agent-sbom
          path: |
            sbom.cdx.json
            sbom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30
