name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Migrate database
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci-agent.db
        run: |
          rm -f ci-agent.db
          alembic upgrade head
          alembic current

      - name: Test
        env:
          PYTHONPATH: .
          CUSTOM_API_BASE_URL: http://127.0.0.1:8000
          CUSTOM_API_TOKEN: test-token
          INTERNAL_API_TOKEN: test-token
          DATABASE_URL: sqlite:///./ci-agent.db
        run: pytest -q
