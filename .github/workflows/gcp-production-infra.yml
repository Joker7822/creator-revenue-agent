name: GCP Production Infra

on:
  push:
    branches:
      - main
    paths:
      - "infra/gcp/production/**"
      - "deploy/kubernetes/production-deployer-gcp-rbac.example.yaml"
      - ".github/workflows/gcp-production-infra.yml"
  pull_request:
    paths:
      - "infra/gcp/production/**"
      - "deploy/kubernetes/production-deployer-gcp-rbac.example.yaml"
      - ".github/workflows/gcp-production-infra.yml"

permissions:
  contents: read

concurrency:
  group: gcp-production-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive infra/gcp/production

      - name: Terraform init without backend
        run: terraform -chdir=infra/gcp/production init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/gcp/production validate
