name: Release Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creator_agent_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creator_agent_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(
              r"v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?",
              tag,
          ):
              raise SystemExit(f"invalid release tag: {tag}")

          image = "ghcr.io/" + os.environ[
              "GITHUB_REPOSITORY"
          ].lower()
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"RELEASE_TAG={tag}\n")
              handle.write(f"IMAGE_NAME={image}\n")
          PY
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Release preflight
        env:
          PYTHONPATH: .
          APP_ENV: production
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/creator_agent_release
          PRODUCTION_REQUIRE_ROW_LOCKING_DATABASE: "true"
          REQUIRE_HUMAN_REVIEW: "true"
          ALLOW_AUTO_PUBLISH: "false"
          ALLOW_LEGACY_ADMIN_TOKEN: "false"
          SERVICE_AUTH_MODE: jwt
          SERVICE_JWT_KEYS_JSON: '{"release-current":"replace-with-32-plus-byte-jwt-secret-value"}'
          SERVICE_JWT_ACTIVE_KID: release-current
          SERVICE_JWT_REQUIRE_ISSUED_RECORD: "true"
          REQUIRE_TRUSTED_VERIFICATION: "true"
          VERIFICATION_WEBHOOK_KEYS_JSON: '{"provider-a":{"release-current":"replace-with-32-plus-byte-provider-secret"}}'
          VERIFICATION_WEBHOOK_REQUIRE_KEY_ID: "true"
          AUDIT_HASH_KEYS_JSON: '{"release-audit":"replace-with-32-plus-byte-audit-secret"}'
          AUDIT_HASH_ACTIVE_KID: release-audit
          AUDIT_ANCHOR_BASE_URL: https://audit-anchor.example.internal
          AUDIT_ANCHOR_TOKEN: replace-with-anchor-token
          AUDIT_ANCHOR_RECEIPT_KEYS_JSON: '{"release-receipt":"replace-with-32-plus-byte-receipt-secret"}'
          ENFORCE_AUDIT_ANCHOR_FRESHNESS_ON_ROLLOUT: "true"
          MAX_REQUEST_BODY_BYTES: "1048576"
          BILLING_RATE_LIMIT_PER_MINUTE: "120"
          CREDENTIAL_RATE_LIMIT_PER_MINUTE: "30"
          ROLLOUT_RATE_LIMIT_PER_MINUTE: "30"
          VERIFICATION_WEBHOOK_RATE_LIMIT_PER_MINUTE: "300"
          METRICS_EXPORT_MODE: prometheus
          EDGE_RATE_LIMIT_MODE: external
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m api_server.release_gate

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable release image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          provenance: false
          sbom: false

      - name: Resolve immutable image reference
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$BUILD_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "IMAGE_DIGEST=$BUILD_DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_NAME}@${BUILD_DIGEST}" >> "$GITHUB_ENV"

      - name: Scan exact pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_REF }}
          format: cyclonedx-json
          output-file: release-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate release SBOM
        run: |
          python scripts/validate_sbom.py release-sbom.cdx.json
          sha256sum release-sbom.cdx.json > release-sbom.cdx.json.sha256

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Attest SBOM
        id: sbom-attestation
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: release-sbom.cdx.json
          push-to-registry: true

      - name: Write release evidence
        env:
          PROVENANCE_ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          SBOM_ATTESTATION_ID: ${{ steps.sbom-attestation.outputs.attestation-id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone

          sbom = open(
              "release-sbom.cdx.json",
              "rb",
          ).read()
          payload = {
              "version": "release-evidence-v1",
              "release_tag": os.environ["RELEASE_TAG"],
              "source_commit": os.environ["GITHUB_SHA"],
              "image_name": os.environ["IMAGE_NAME"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "image_reference": os.environ["IMAGE_REF"],
              "sbom_sha256": hashlib.sha256(sbom).hexdigest(),
              "provenance_attestation_id": os.environ[
                  "PROVENANCE_ATTESTATION_ID"
              ],
              "sbom_attestation_id": os.environ[
                  "SBOM_ATTESTATION_ID"
              ],
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
          }
          with open(
              "release-evidence.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(
                  payload,
                  handle,
                  indent=2,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
          sha256sum release-evidence.json > release-evidence.json.sha256
          printf '%s\n' "$IMAGE_REF" > release-image.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ env.RELEASE_TAG }}
          path: |
            release-sbom.cdx.json
            release-sbom.cdx.json.sha256
            release-evidence.json
            release-evidence.json.sha256
            release-image.txt
          if-no-files-found: error
          retention-days: 90
